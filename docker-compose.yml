services:
  redis:
    image: redis:7
    container_name: agent-memory-redis
    ports:
      - "6379:6379"
    # AOF = append-only file: every write is logged to disk so data survives restarts
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
